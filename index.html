<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy Fussball</title><meta name="description" content="Fantasy Fussball: a private Bundesliga fantasy game among friends."><style>
:root{--bg:#F4F5F6;--card:#FFFFFF;--ink:#000E14;--muted:#34383C;--red:#D20515;--line:#C9CCCF;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#000E14;--card:#0C1A21;--ink:#F4F5F6;--muted:#C9CCCF;--red:#FF6B6B;--line:#34383C}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:46rem;margin:0 auto;padding:2rem 1rem 4rem}
h1{font-size:2rem;line-height:1.2;margin:0 0 .25rem;text-transform:none;letter-spacing:.01em}
h1::after{content:"";display:block;width:3rem;height:.25rem;background:var(--red);margin-top:.75rem}
h2{font-size:1.5rem;margin:0 0 .25rem}h3{font-size:1.1rem;margin:1.5rem 0 .25rem}
.lang{font-weight:400;color:var(--muted)}.updated{color:var(--muted);margin:0 0 1rem}
section{background:var(--card);border:1px solid var(--line);border-radius:.75rem;padding:1.25rem 1.25rem 1.5rem;margin:1.5rem 0}
nav ul{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:.5rem}
nav a{display:inline-block;min-height:48px;min-width:48px;padding:.75rem 1rem;border:1px solid var(--line);border-radius:.5rem;background:var(--card)}
a{color:var(--red);text-underline-offset:.15em}a:focus-visible{outline:3px solid var(--red);outline-offset:2px}
li{margin:.35rem 0}
</style></head>
<body><main><h1>Fantasy Fussball</h1><p>A private Bundesliga fantasy game among friends, for Android and iPhone.</p><p><a href="privacy/">Privacy policy</a> · <a href="mailto:seerauberstudios@gmail.com">seerauberstudios@gmail.com</a></p></main></body></html>
